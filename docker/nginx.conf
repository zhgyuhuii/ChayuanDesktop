# 察元 AI Docker — nginx 反代 + 前端 SPA
#
# 浏览器开 http://<host>/  → 前端 React SPA
# fetch 走相对路径,nginx 反代到 chayuan-server (127.0.0.1:62581)
# 同源,无 CORS。

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 关 access log,容器里没用
    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # SSE / 大文件上传:chat 流式响应一直挂,不要 buffer 不要 timeout
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1024m;

    # gzip 前端 bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    upstream chayuan_api {
        server 127.0.0.1:62581;
        keepalive 32;
    }

    upstream chayuan_config_panel {
        server 127.0.0.1:8502;
        keepalive 8;
    }

    server {
        listen      80 default_server;
        server_name _;

        root  /chayuan/web;
        index index.html;

        # 1. 健康检查:nginx 起就 ready (后端 ready 由 Dockerfile HEALTHCHECK
        #    包到 /healthz,这里返 200 让 nginx 自身可探)
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 2. 统一路由(无前缀白名单)—— 后端接口不再需要逐个登记:
        #    静态文件由下面 `location /` 的 try_files 直接发;命不中文件的请求进 @route:
        #      - 浏览器整页导航(Accept: text/html,如 /home /chat /admin)→ SPA index.html;
        #      - fetch / XHR / SSE(Accept 非 html)→ 一律反代后端 chayuan-server。
        #    新增任何后端 path(如 kb_summary_api)自动生效,无需再改 nginx。
        #    /v1/* 仍是 OpenAI 兼容接口(WPS / SDK baseURL=http://host/v1)。
        location @route {
            # 默认:浏览器整页导航(Accept: text/html,如 /home /chat /admin)当 SPA 路由
            # → index.html。但「后端文件端点」(文档下载/预览、模态产物、图像、存储流)也
            # 常被浏览器用整页导航语义访问(window.open 下载 / iframe 预览 / <a> 打开),
            # Accept 同样是 text/html,必须反代后端取文件,**不能** rewrite 成 index.html
            # (否则点对话里「原文/下载」→ 拿到前端 SPA → 路由「页面不存在」→ /home → 要登录)。
            # 故对这些路径强制 spa=0(走后端反代),其余 text/html 才当 SPA。
            set $spa "0";
            if ($http_accept ~* "text/html") { set $spa "1"; }
            if ($uri ~* "^/(v1/files|knowledge_base/(download|preview)_doc|v1/artifacts/|knowledge_source/[^/]+/image|storage/stream)") { set $spa "0"; }
            if ($spa = "1") {
                rewrite ^ /index.html last;
            }

            proxy_pass http://chayuan_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 长连接 + 禁 buffer
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # 3. config panel (NiceGUI) 反代到 :8502
        location /config-panel/ {
            rewrite ^/config-panel/(.*) /$1 break;
            proxy_pass http://chayuan_config_panel;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 86400;
        }

        # 4. 入口:真实静态文件(/assets/* /index.html 等)直接发;命不中 → @route。
        location / {
            try_files $uri $uri/ @route;
        }
    }
}
