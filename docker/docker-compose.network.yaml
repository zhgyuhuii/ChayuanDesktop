# 察元 AI — 网络/服务器部署(开箱即用,基础设施默认配好)
# ====================================================================
# 容器起来后【直接能用】:业务库=PostgreSQL、缓存/队列=Redis、对象存储=MinIO、
# 向量库=Milvus(默认)。察元用【容器服务名】连接,数据全部映射到宿主机。
# 进 /admin 「服务状态」应全绿。
#
# 全用你已有的镜像,不额外拉取:
#   chayuan-server:latest(一体化:前端 nginx + API + 配置面板)
#   postgres:15 / redis:latest / milvusdb/milvus:v2.6.15 /
#   quay.io/coreos/etcd:v3.5.5 / minio/minio:RELEASE.2023-03-20T20-16-18Z
#
# 启动:
#   cd docker
#   docker compose -f docker-compose.network.yaml up -d
#   浏览器 http://<host>:8080/  (端口遵循原有约定:8080 网页 / 62581 API / 8502 面板;首次进去先「设置首个管理员」)
#
# 端口沿用原有约定:8080(网页) / 62581(后端 API,WPS 等固定连这个) / 8502(配置面板)。
# ⚠ 报「8080 already allocated」≠ 要改端口:是有别的容器(多半是单机版或旧残留)占着 8080。
#    先按下面清理,别和单机版同起;真要换网页口再在 .env 设 CHAYUAN_WEB_PORT(62581 不要改)。
# ⚠ 不要和单机版 docker-compose.yaml 同时起:两者 container_name 都叫 chayuan-server,
#    会冲突。先 `docker compose -f docker-compose.yaml down`。
#
# 切换组件(都在下面留了注释,放开即用):
#   - 业务库换 MySQL:放开 mysql 服务 + init 的 CHAYUAN_DB_URI(mysql),注释 postgres。
#   - 向量库换别的(pg/es/...):见 milvus 段下方注释,或起容器后进 /admin「向量库」改。
# ====================================================================
name: chayuan-network

# ── init 用:写 prod 配置(postgres + redis + milvus + 鉴权)到 ./data 的 yaml ──
x-init-env: &init-env
  CHAYUAN_ROOT: /chayuan/data
  CHAYUAN_PROFILE: ""                  # 空=网络形态(别用 single-machine,它会覆盖回 sqlite)
  CHAYUAN_AUTO_INSTALL_DEPS: "false"
  # 业务库 = PostgreSQL(容器服务名 postgres)
  CHAYUAN_PG_HOST: postgres
  CHAYUAN_PG_PORT: "5432"
  CHAYUAN_PG_USER: ${POSTGRES_USER:-chayuan}
  CHAYUAN_PG_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
  CHAYUAN_PG_DB: ${POSTGRES_DB:-chayuan}
  # 换 MySQL:注释上面 PG_*,放开下面(并放开 mysql 服务 + 注释 postgres 服务)
  # CHAYUAN_DB_URI: "mysql+pymysql://${MYSQL_USER:-chayuan}:${MYSQL_PASSWORD:-chayuan}@mysql:3306/${MYSQL_DB:-chayuan}"
  # 缓存/队列 = Redis(容器服务名 redis)
  CHAYUAN_REDIS_URL: redis://redis:6379/0
  # 向量库 = Milvus(容器服务名 milvus → http://milvus:19530)
  CHAYUAN_MILVUS_HOST: milvus
  CHAYUAN_MILVUS_PORT: "19530"
  # JWT 留空则 init 随机生成并持久化;想固定填 .env 的 JWT_SECRET
  CHAYUAN_JWT_SECRET: ${JWT_SECRET:-}

# ── server / worker 运行期 env:env 优先级高于 yaml,这里把【对象存储=MinIO】配死 ──
# (postgres/redis/milvus/鉴权 已由 init 写进 yaml,server 读 yaml 即可)
x-runtime-env: &runtime-env
  CHAYUAN_ROOT: /chayuan/data
  CHAYUAN_PROFILE: ""
  CHAYUAN_AUTO_INSTALL_DEPS: "false"
  # 对象存储 = MinIO(容器服务名 minio:9000)。env 覆盖 yaml 默认的 local。
  FILE_STORAGE_BACKEND: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_SECURE: "false"

x-chayuan-volumes: &chayuan-volumes
  - ./data:/chayuan/data
  - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
  - ./config:/chayuan/config
  - ./logs:/chayuan/logs

services:
  # ───────────────── 业务库:PostgreSQL ─────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 业务库(可选):MySQL ─────────────────
  # 换 MySQL:放开本服务 + init-env 里的 CHAYUAN_DB_URI(mysql),并注释上面 postgres。
  # 需要 mysql 镜像(你列表里没有,放开前先准备 mysql:8)。
  # mysql:
  #   image: mysql:8
  #   container_name: mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_DATABASE: ${MYSQL_DB:-chayuan}
  #     MYSQL_USER: ${MYSQL_USER:-chayuan}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chayuan}
  #   command: ["--default-authentication-plugin=mysql_native_password"]
  #   volumes:
  #     - ./volumes/mysql:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # ───────────────── 缓存 / 队列:Redis ─────────────────
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 对象存储:MinIO ─────────────────
  # 同时给 Milvus 当后端存储 + 给察元当对象存储(不同 bucket,不冲突)。
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    # MinIO 控制台(可选,排查用):
    # ports:
    #   - "9001:9001"

  # ───────────────── 向量库:Milvus(默认) + 依赖 etcd ─────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
  # 换别的向量库(pg/pgvector、es 等):Milvus 仍是默认,起容器后进 /admin「向量库」
  # 把类型切到目标后端、填好连接(host 用对应容器服务名)即可;无需改本文件。

  # ───────────────── 察元:init(一次性) / server / worker ─────────────────
  # init:把 prod 配置(postgres+redis+milvus+鉴权)写进 ./data 的 yaml + 建表。
  chayuan-init:
    image: chayuan-server:latest
    container_name: chayuan-init
    restart: "no"
    command: ["init", "-q", "--profile", "prod"]
    environment: *init-env
    volumes: *chayuan-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chayuan-server:
    image: chayuan-server:latest
    container_name: chayuan-server
    restart: unless-stopped
    command: ["start", "-a"]              # 不带 --single-machine
    environment: *runtime-env
    volumes: *chayuan-volumes
    ports:
      - "${CHAYUAN_WEB_PORT:-8080}:80"     # 前端 + API 反代 ← 浏览器主入口(原有约定 8080)
      - "62581:62581"                      # ★ 后端 API 直连:WPS / Tauri / 三方都连这个,固定不可改
      - "8502:8502"                        # 后台配置面板(NiceGUI,原有约定)
    depends_on:
      chayuan-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # 异步入库 worker:prod 默认开启异步入库,上传/解析/向量化走 Redis 队列,必须有它消费。
  chayuan-worker:
    image: chayuan-server:latest
    container_name: chayuan-worker
    restart: unless-stopped
    command: ["worker"]
    environment: *runtime-env
    volumes: *chayuan-volumes
    depends_on:
      chayuan-server:
        condition: service_started
