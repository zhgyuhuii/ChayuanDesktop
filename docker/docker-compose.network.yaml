# 察元 AI — 网络/服务器部署(多服务,容器名互联)
# ====================================================================
# 与单机版的区别:
#   单机版 docker-compose.yaml = 一个容器跑全部(sqlite-vec / inproc / 无登录)。
#   本文件   = 真·网络部署:
#       postgres + redis + milvus(+etcd+minio) 各自独立容器,
#       chayuan-server / worker / client 用【容器(服务)名】连过去,
#       开启多用户登录(强制验证)。
#
# 所有可变数据都【映射到宿主机】本目录(docker/)下:
#   ./data              ← 业务数据 / 上传文件 / 运行时 yaml(init 写)/ 日志
#   ./bundled_models    ← chat/embedding/rerank/asr 模型(用户自备 GGUF)
#   ./config            ← 可选:覆盖 *.yaml 配置
#   ./logs              ← chayuan-server 日志
#   ./volumes/postgres  ← PostgreSQL 数据
#   ./volumes/redis     ← Redis AOF 持久化
#   ./volumes/etcd      ← Milvus 元数据(etcd)
#   ./volumes/minio     ← Milvus 对象存储(minio)
#   ./volumes/milvus    ← Milvus 向量数据
#
# 一键启动:
#   cd docker
#   cp .env.network.example .env          # 填 JWT_SECRET / 密码
#   docker compose -f docker-compose.network.yaml up -d
#
# 浏览器:http://<host>:8080/   首次进去要登录(初始 admin 见下)。
#
# 启动顺序(compose 自动按 depends_on 编排):
#   postgres/redis/milvus 起 → chayuan-init 跑一次 `init --profile prod`
#   (把 postgres/milvus/redis 连接写进 ./data 的 yaml + 建表)→
#   chayuan-server(start)+ chayuan-worker(异步入库)→ chayuan-client(nginx)。
# ====================================================================
name: chayuan-network

# ── 三个 chayuan 进程(init / server / worker)共用同一套 env 与挂载 ──
# 用容器(服务)名连基础设施:postgres / redis / milvus 都是下面的 service 名,
# 同一个 compose 默认网络里 DNS 直接可解析,无需 IP。
x-chayuan-env: &chayuan-env
  CHAYUAN_ROOT: /chayuan/data
  # ⚠ 必须置空覆盖镜像内置的 CHAYUAN_PROFILE=single-machine,
  #   空值 = 走 SaaS/网络形态(用 postgres/redis/milvus,而非 sqlite/inproc)。
  CHAYUAN_PROFILE: ""
  # init 时套 prod profile:postgres + milvus + redis + 多 worker + 启用鉴权。
  CHAYUAN_INIT_PROFILE: "prod"
  CHAYUAN_AUTO_INSTALL_DEPS: "false"
  CHAYUAN_VENDOR_PLATFORM: linux-x64
  # ── PostgreSQL(主业务库)── 连接 = 服务名 postgres ──
  CHAYUAN_PG_HOST: postgres
  CHAYUAN_PG_PORT: "5432"
  CHAYUAN_PG_USER: chayuan
  CHAYUAN_PG_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
  CHAYUAN_PG_DB: chayuan
  # ── Redis(限流 / 语义缓存 / arq 异步队列)── 连接 = 服务名 redis ──
  CHAYUAN_REDIS_URL: redis://redis:6379/0
  # ── Milvus(向量库)── 连接 = 服务名 milvus,自动拼成 http://milvus:19530 ──
  CHAYUAN_MILVUS_HOST: milvus
  CHAYUAN_MILVUS_PORT: "19530"
  CHAYUAN_MILVUS_SECURE: "false"
  # ── 鉴权(多用户登录,强制验证)──
  # JWT_SECRET 可留空:留空时 init 会随机生成并写进 ./data 的 basic_settings.yaml,
  # server / worker 都读同一份(共享 ./data 卷)所以密钥一致,无需手动设。
  # 想固定密钥 / 多机一致时,再在 docker/.env 里设 JWT_SECRET(openssl rand -hex 64)。
  CHAYUAN_JWT_SECRET: ${JWT_SECRET:-}
  # 首次启动若库里没用户,按此用户名 + 密码建管理员。
  # 密码留空 = 随机生成并打到启动日志(docker compose logs chayuan-server 截一次)。
  AUTH_DEFAULT_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  AUTH_DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

x-chayuan-volumes: &chayuan-volumes
  - ./data:/chayuan/data
  - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
  - ./config:/chayuan/config
  - ./logs:/chayuan/logs

services:
  # ──────────────────────────────────────────────────────────────
  # 基础设施:PostgreSQL / Redis / Milvus(etcd + minio + milvus)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chayuan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chayuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: chayuan
      # 数据落在子目录,避免 alpine 镜像对挂载根目录权限的挑剔
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chayuan -d chayuan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: chayuan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Milvus standalone 的两个依赖:etcd(元数据)+ minio(对象存储)。
  # 注意:这个 minio 是 Milvus 内部用的,跟「察元文件存储」无关(后者默认 local)。
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chayuan-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: chayuan-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: chayuan-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 如需外部工具(Attu 等)直连,放开端口:
    # ports:
    #   - "19530:19530"
    #   - "9091:9091"

  # ──────────────────────────────────────────────────────────────
  # 察元:init(一次性)/ server / worker / client
  # ⚠ 下面 image 用的是 split 两镜像约定名,请替换成你已有的实际 tag:
  #     chayuan-server:split  ← 后端(entrypoint.server.sh,跑 python -m chayuan)
  #     chayuan-client:split  ← 前端 nginx(反代 chayuan-server:62581)
  #   (build.sh / docker-compose.split.yaml 产出的就是这两个名字)
  # ──────────────────────────────────────────────────────────────

  # 一次性初始化:把 postgres/milvus/redis 连接写进 ./data 下的 yaml 并建表。
  # 跑完即退出(restart: "no");server/worker 等它成功后再起。
  chayuan-init:
    image: chayuan-server:split
    container_name: chayuan-init
    restart: "no"
    command: ["init", "-q", "--profile", "prod"]
    environment: *chayuan-env
    volumes: *chayuan-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chayuan-server:
    image: chayuan-server:split
    container_name: chayuan-server          # ⚠ 必须叫这个:nginx.split.conf 反代目标 = chayuan-server:62581
    restart: unless-stopped
    command: ["start", "-a"]                 # 注意:不带 --single-machine,走网络形态
    environment: *chayuan-env
    volumes: *chayuan-volumes
    depends_on:
      chayuan-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:62581/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    # 需要 WPS / Tauri / 三方 OpenAI SDK 直连后端时放开:
    # ports:
    #   - "62581:62581"

  # 异步入库 worker:prod 默认 INGEST_ASYNC_ENABLED=true,上传/解析/向量化走
  # arq 队列,必须有 worker 消费,否则上传任务会一直挂起。
  chayuan-worker:
    image: chayuan-server:split
    container_name: chayuan-worker
    restart: unless-stopped
    command: ["worker"]
    environment: *chayuan-env
    volumes: *chayuan-volumes
    depends_on:
      chayuan-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  chayuan-client:
    image: chayuan-client:split
    container_name: chayuan-client
    restart: unless-stopped
    ports:
      - "${CHAYUAN_WEB_PORT:-8080}:80"       # 浏览器主入口
    depends_on:
      chayuan-server:
        condition: service_started
