# 察元 AI — 网络/服务器部署(基础设施容器全起,连接由管理员后台配置)
# ====================================================================
# 设计原则(按用户要求):
#   ★ compose 只【把各服务作为容器跑起来】,放在同一个网络里,数据映射到宿主机。
#   ★ compose 【不预配置】任何连接 —— chayuan-server 启动时是「未配置」状态
#     (默认 sqlite,可直接进系统)。
#   ★ 进【管理员后台 /admin → 基础设施】里,把数据库 / Redis / 向量库 / 对象存储
#     的 host 填成【容器服务名】(postgres / redis / milvus / minio:9000)或直接填 IP,
#     点「测试连通」验证 → 保存。
#   ★ ⚠ 连接类配置【保存后需重启 chayuan-server 生效】(连接在启动时建立并缓存):
#        docker compose -f docker-compose.network.yaml restart chayuan-server
#
# 用到的镜像(全部用你已有的,不额外拉取):
#   chayuan-server:latest                       一体化(前端 nginx + API + 配置面板)
#   postgres:15                                 关系库(管理员后台里连)
#   redis:latest                                缓存 / 限流 / 异步入库队列
#   milvusdb/milvus:v2.6.15                      向量库(standalone)
#   quay.io/coreos/etcd:v3.5.5                    Milvus 依赖(元数据)
#   minio/minio:RELEASE.2023-03-20T20-16-18Z     Milvus 依赖 + 可兼作察元对象存储
#
# 数据全部映射到宿主机 docker/ 下:
#   ./data ./logs ./config ./bundled_models
#   ./volumes/{postgres,redis,etcd,minio,milvus}
#
# 启动:
#   cd docker
#   docker compose -f docker-compose.network.yaml up -d
#   浏览器 http://<host>:8080/ → 首次进去先「设置首个管理员」→ 进 /admin 配基础设施。
# ====================================================================
name: chayuan-network

services:
  # ──────────────────────────────────────────────────────────────
  # 基础设施容器(只是把服务跑起来,等管理员后台来连;不往 chayuan 注入连接)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres                  # ← 管理员后台「数据库」host 就填这个名字
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis                      # ← 管理员后台「Redis」host 填 redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Milvus standalone 的两个依赖(etcd 元数据 + minio 对象存储)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio                      # ← 若做察元对象存储,后台 endpoint 填 minio:9000
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: milvus                      # ← 管理员后台「向量库 milvus」host 填 milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 外部工具(Attu 等)直连时放开:
    # ports:
    #   - "19530:19530"

  # ──────────────────────────────────────────────────────────────
  # 察元(一体化镜像:前端 + API + 配置面板)。启动即「未配置」状态,
  # 进 /admin 再配 postgres/redis/milvus。CHAYUAN_PROFILE 置空很关键:
  # 不能用 single-machine(它会每次启动强制覆盖回 sqlite,把后台配的连接冲掉)。
  # ──────────────────────────────────────────────────────────────

  # 一次性:生成默认(本地 sqlite)配置模板,让 server 能干净启动。
  # 注意:这是「默认/未配置」基线,不写任何 postgres/redis/milvus 连接。
  chayuan-init:
    image: chayuan-server:latest
    container_name: chayuan-init
    restart: "no"
    command: ["init", "-q"]                    # 走镜像默认 entrypoint(含建目录),只跑一次 init
    environment:
      CHAYUAN_ROOT: /chayuan/data
      CHAYUAN_PROFILE: ""
      CHAYUAN_AUTO_INSTALL_DEPS: "false"
    volumes:
      - ./data:/chayuan/data
      - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
      - ./config:/chayuan/config
      - ./logs:/chayuan/logs

  chayuan-server:
    image: chayuan-server:latest
    container_name: chayuan-server
    restart: unless-stopped
    # 一体化镜像默认 entrypoint 跑 nginx + python；这里走默认 ENTRYPOINT,
    # 只把命令从「single-machine」换成普通 start(网络形态,后台配置可持久)。
    command: ["start", "-a"]
    environment:
      CHAYUAN_ROOT: /chayuan/data
      CHAYUAN_PROFILE: ""                      # ⚠ 必须置空,覆盖镜像内置 single-machine
      CHAYUAN_AUTO_INSTALL_DEPS: "false"
    volumes:
      - ./data:/chayuan/data                   # ★ 管理员后台配置写在这里,持久化+重启不丢
      - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
      - ./config:/chayuan/config
      - ./logs:/chayuan/logs
    ports:
      - "${CHAYUAN_WEB_PORT:-8080}:80"          # 浏览器主入口(前端 + API 反代)
      # - "62581:62581"                         # 后端 API 直连(WPS/Tauri/三方)
      # - "8502:8502"                           # 旧 NiceGUI 配置面板(React /admin 已取代)
    depends_on:
      chayuan-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # 异步入库 worker:仅当你在后台开启了 Redis + 异步入库后才需要。
  # 默认注释掉(符合「默认不配置」)。配好 Redis 后取消注释并 up -d。
  # chayuan-worker:
  #   image: chayuan-server:latest
  #   container_name: chayuan-worker
  #   restart: unless-stopped
  #   command: ["worker"]
  #   environment:
  #     CHAYUAN_ROOT: /chayuan/data
  #     CHAYUAN_PROFILE: ""
  #   volumes:
  #     - ./data:/chayuan/data
  #     - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
  #     - ./config:/chayuan/config
  #     - ./logs:/chayuan/logs
  #   depends_on:
  #     chayuan-server:
  #       condition: service_started

  # PaddleOCR(paddlecloud/paddleocr:2.6-cpu-latest):你已有这个镜像,但
  # 「察元如何对接外部 OCR 容器」需确认(一体化镜像很可能已内置 in-process OCR,
  # 不需要单独 OCR 容器)。确认对接方式前先不接,避免接错。需要的话告诉我,
  # 我查清 capability_router 的 OCR 端点再补这个 service。
