# chayuan-client (split 部署) — serve React SPA + 按容器名反代 chayuan-server
# 本文件放进 nginx:alpine 的 /etc/nginx/conf.d/ (基础镜像 nginx.conf 的 http{} 已 include 它),
# 故这里只写 server{},不写 http{}。
server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log off;
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # docker 内嵌 DNS(127.0.0.11):按容器名每请求重解析,chayuan-server 重启换 IP 不挂。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # client 自身存活探针(与后端 /healthz 无关)
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 统一路由(无前缀白名单,与单镜像 nginx.conf 同一套策略)—— 后端新增 path 自动生效,
    # 不再"两处同步白名单"。静态文件由下面 location / 直发;命不中 → @route:
    #   浏览器整页导航(Accept: text/html)→ SPA index.html;fetch/XHR/SSE → 反代后端。
    location @route {
        # 后端文件端点(文档下载/预览、模态产物、图像、存储流)常被浏览器用整页导航语义
        # 访问(window.open 下载 / iframe 预览 / <a> 打开),Accept 也是 text/html,必须反代
        # 后端取文件,不能 rewrite 成 index.html(否则点对话「原文/下载」→ 前端「页面不存在」
        # → /home → 要登录)。故对这些路径强制 spa=0,其余 text/html 才当 SPA。
        set $spa "0";
        if ($http_accept ~* "text/html") { set $spa "1"; }
        if ($uri ~* "^/(knowledge_base/(download|preview)_doc|v1/artifacts/|knowledge_source/[^/]+/image|storage/stream)") { set $spa "0"; }
        if ($spa = "1") {
            rewrite ^ /index.html last;
        }

        # 用变量 + resolver 触发每请求重解析;静态 upstream 只启动解析一次(server 没起就 502)。
        set $upstream http://chayuan-server:62581;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接 + 禁 buffer(对齐单镜像 nginx.conf)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 前端入口:真实静态文件直发,否则交给 @route(SPA 兜底 / 后端反代)
    location / {
        try_files $uri $uri/ @route;
    }
}
