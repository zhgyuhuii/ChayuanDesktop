# chayuan-client (split 部署) — serve React SPA + 按容器名反代 chayuan-server
# 本文件放进 nginx:alpine 的 /etc/nginx/conf.d/ (基础镜像 nginx.conf 的 http{} 已 include 它),
# 故这里只写 server{},不写 http{}。
server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log off;
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # docker 内嵌 DNS(127.0.0.11):按容器名每请求重解析,chayuan-server 重启换 IP 不挂。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # client 自身存活探针(与后端 /healthz 无关)
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 后端 API 路径反代到 chayuan-server:62581(容器名,docker 网络内解析)。
    # 路径清单与单镜像 nginx.conf 保持一致;前端新增路由组要两处同步。
    location ~ ^/(api|v1|chat|knowledge_base|knowledge_universe|knowledge_source|admin|runtime|model_registry|tools|tool|prompts|temp|file|files|media|img|status|live|ready|metrics|conversation|user|users|auth|kb-query|sse|sidecar|install_jobs|annotation|llm|llm_model|ai_platform|local_runtime|provider|capability|home|storage|modality|image_models|folder_sync|data-mounts|external-agents|install|logs|skills)(/|$) {
            # 整页导航(浏览器地址栏/刷新,Accept: text/html):即使路径前缀与 API 撞
            # (/home /chat /admin /tools 等),也交给 SPA index.html,不再 404;
            # 真正的 API(fetch/XHR/SSE,Accept 非 html)才往下反代后端。
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }

        # 用变量 + resolver 触发每请求重解析;静态 upstream 只启动解析一次(server 没起就 502)。
        set $upstream http://chayuan-server:62581;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接 + 禁 buffer(对齐单镜像 nginx.conf)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 前端 SPA:文件存在直发,否则 fallback index.html(React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
