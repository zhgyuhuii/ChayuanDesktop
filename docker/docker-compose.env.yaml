# 察元 AI — 纯基础设施 compose(只起 postgres/redis/minio/milvus/etcd)
# ====================================================================
# 用途:把基础设施容器化,给【另外单起的察元】用。察元自己怎么起都行:
#   - 拉取式一体化镜像 → 配套用 docker-compose.app.yaml(推荐,两份文件成套)
#   - 源码跑的察元(python cli.py start -a)→ 用下面的宿主机端口连
#   - 别的机器 → 用本机 IP + 下面的宿主机端口连
# ★ 本文件不含察元本体。
#
# 启动:  docker compose -f docker-compose.env.yaml up -d
# 停止:  docker compose -f docker-compose.env.yaml down
#
# ── 端口规约:全部「默认端口 +30000」──────────────────────────────
# 复用 chayuan/settings.py 的 VENDOR_PREFERRED_PORTS 既有约定
# (「开箱默认全部 +30000:postgres 5432→35432、redis 6379→36379、minio 9000→39000」),
# 一次性躲开宿主机上 1Panel / 宝塔 / 别的 compose 占着的标准端口。
#
# 宿主机连接地址(源码察元 / navicat / redis-cli / 外部程序用这些):
#   PostgreSQL  localhost:35432  (user/pass/db = chayuan/chayuan/chayuan,可在 .env 改)
#   Redis       localhost:36379
#   MinIO       localhost:39000  控制台 http://localhost:39001 (minioadmin/minioadmin)
#   Milvus      localhost:39530  (metrics 39091)
#   etcd        localhost:32379
#
# ★★ 容器内互连【永远用容器内端口,不是上面这些】★★
#   同 chayuan-net 网络的其它容器,一律用「服务名 + 容器内端口」:
#     chayuan-postgres:5432   chayuan-redis:6379   chayuan-minio:9000
#     chayuan-milvus:19530    chayuan-etcd:2379
#   ports 里 "35432:5432" 左边=宿主机、右边=容器内;改端口只动左边。
#   把宿主机端口填进容器间地址(如 MINIO_ADDRESS: chayuan-minio:39000)必然连不上,
#   典型症状:Milvus 报「Proxy is not ready yet」(它连不上对象存储,内部组件起不来)。
#
# ⚠ 不要和 docker-compose.yaml(网络版,自带同一套基础设施)同时起。
#   容器名和端口现在虽然不撞了,但 ./volumes/* 是同一份数据目录 ——
#   两个 postgres / milvus 实例同时写同一个数据目录会直接损坏数据。
# ====================================================================
name: chayuan-env

services:
  # ───────────────── 业务库:PostgreSQL ─────────────────
  chayuan-postgres:
    image: postgres:15
    container_name: chayuan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-35432}:5432"        # 宿主机 35432 → 容器内 5432
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 业务库(可选):MySQL ─────────────────
  # 需要 MySQL:放开本段(需 mysql:8 镜像)。宿主机连 localhost:33306;
  # 容器内(察元)连 chayuan-mysql:3306 —— 见 docker-compose.app.yaml 的 CHAYUAN_DB_URI。
  # chayuan-mysql:
  #   image: mysql:8
  #   container_name: chayuan-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_DATABASE: ${MYSQL_DB:-chayuan}
  #     MYSQL_USER: ${MYSQL_USER:-chayuan}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chayuan}
  #   command: ["--default-authentication-plugin=mysql_native_password"]
  #   ports:
  #     - "${MYSQL_PORT:-33306}:3306"
  #   volumes:
  #     - ./volumes/mysql:/var/lib/mysql

  # ───────────────── 缓存 / 队列:Redis ─────────────────
  chayuan-redis:
    image: redis:latest
    container_name: chayuan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-36379}:6379"          # 宿主机 36379 → 容器内 6379
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 对象存储:MinIO(Milvus 的后端存储) ─────────────────
  # API 容器内固定监听 9000(command 里没有 --address),不随宿主机端口变化。
  # 控制台【容器内外用同一个端口】(默认都是 39001),这是有意的,别改回 :9001 ——
  # 用浏览器打 API 口(39000)时 MinIO 会 307 跳控制台,而它构造跳转用的是
  # --console-address 里那个【容器内】端口号(主机名倒是跟着请求 Host 走)。
  # 若容器内写 :9001 而宿主机映射到 39001,浏览器就会被送去 <host>:9001 ——
  # 撞上宿主机上别的容器(实测:39000 → 307 → http://<host>:9001)。
  chayuan-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: chayuan-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":${MINIO_CONSOLE_PORT:-39001}"]
    ports:
      - "${MINIO_PORT:-39000}:9000"                                    # 宿主机 39000 → 容器内 9000(S3 API)
      - "${MINIO_CONSOLE_PORT:-39001}:${MINIO_CONSOLE_PORT:-39001}"    # 控制台:内外同号(见上)
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      # 注意:这条是在容器【内部】跑的,所以打的是 9000,不是 39000。
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ───────────────── 向量库:Milvus + etcd 依赖 ─────────────────
  chayuan-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chayuan-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    ports:
      - "${ETCD_PORT:-32379}:2379"           # 宿主机 32379 → 容器内 2379
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  chayuan-milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: chayuan-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      # ★ 这两个是【容器 → 容器】的地址,必须用容器内端口(2379 / 9000)。
      #   写成宿主机端口(32379 / 39000)= Milvus 连不上 etcd/MinIO
      #   → 卡在初始化 → 客户端报「Milvus Proxy is not ready yet」。
      ETCD_ENDPOINTS: chayuan-etcd:2379
      MINIO_ADDRESS: chayuan-minio:9000
    ports:
      - "${MILVUS_PORT:-39530}:19530"        # 宿主机 39530 → 容器内 19530
      - "${MILVUS_METRICS_PORT:-39091}:9091" # 宿主机 39091 → 容器内 9091
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s                     # Milvus 冷启动要 1~2 分钟,别急着连
    depends_on:
      chayuan-etcd:
        condition: service_healthy
      chayuan-minio:
        condition: service_healthy

# 共享网络:与 docker-compose.app.yaml / docker-compose.yaml / docker-compose.single.yaml
# 同名 chayuan-net,不存在时 compose 自动创建(非 external,无需手动 docker network create)。
# 别的容器接到 chayuan-net 就能用服务名连;宿主机/源码用上面的 3xxxx 端口。
# ⚠ 若你之前【手动】docker network create chayuan-net 过,会报 incorrect label,
#   执行一次 `docker network rm chayuan-net` 让 compose 接管即可。
networks:
  default:
    name: chayuan-net
