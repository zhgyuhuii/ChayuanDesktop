# 察元 AI — 纯基础设施 compose(只起 postgres/redis/minio/milvus/etcd,端口全映射到宿主机)
# ====================================================================
# 用途:把基础设施容器化 + 端口暴露到宿主机,让【源码跑的察元(python cli.py start -a)】
#      或宿主机其它程序 / 其它容器,用 localhost:<端口> 或容器名 单独连接。
# ★ 不含 chayuan-server —— 察元你自己单独起(源码/别的镜像/别的机器都行)。
#
# 启动:  docker compose -f docker-compose.env.yaml up -d
# 停止:  docker compose -f docker-compose.env.yaml down
#
# 宿主机连接地址(源码 chayuan 或外部程序用这些):
#   PostgreSQL  localhost:5432   (user/pass/db = chayuan/chayuan/chayuan,可在 .env 改)
#   Redis       localhost:6379
#   MinIO       localhost:9000   控制台 http://localhost:9001 (minioadmin/minioadmin)
#   Milvus      localhost:19530  (metrics 9091)
#   etcd        localhost:2379
#
# 容器内互连(同 chayuan-net 网络的其它容器):用服务名 postgres/redis/minio/milvus:端口。
#
# ⚠ 不要和 docker-compose.yaml(网络版,已含同名基础设施)同时起 —— 容器名 + 端口都会撞。
#   本文件是给「基础设施容器化 + 察元另起」的分离部署用的。
# 数据卷:与网络版同路径 ./volumes/*,两套共用同一份基础设施数据。
# ====================================================================
name: chayuan-env

services:
  # ───────────────── 业务库:PostgreSQL ─────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 业务库(可选):MySQL ─────────────────
  # 需要 MySQL:放开本段(需 mysql:8 镜像),源码 chayuan 连 localhost:3306。
  # mysql:
  #   image: mysql:8
  #   container_name: mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_DATABASE: ${MYSQL_DB:-chayuan}
  #     MYSQL_USER: ${MYSQL_USER:-chayuan}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chayuan}
  #   command: ["--default-authentication-plugin=mysql_native_password"]
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - ./volumes/mysql:/var/lib/mysql

  # ───────────────── 缓存:Redis ─────────────────
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 对象存储:MinIO(API 9000 + 控制台 9001) ─────────────────
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ───────────────── 向量库:Milvus + etcd 依赖 ─────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

# 共享网络:与 docker-compose.yaml / docker-compose.single.yaml 同名 chayuan-net,
# 不存在时自动创建。别的容器接到 chayuan-net 就能用服务名连;宿主机/源码用 localhost:端口。
networks:
  default:
    name: chayuan-net
