# 察元 AI — 默认部署 = 网络/服务器部署(察元单容器 + 基础设施容器)
# (这就是 `docker compose up -d` 起的那套;单机版见 docker-compose.single.yaml)
# ====================================================================
# 察元只有【一个容器 chayuan-server】(就是你打的那一个镜像 chayuan:<版本>(默认 chayuan:latest)),
# 起来后【前端(:8080) + 后端 API(:62581) + 配置面板(:8502)】全都能访问。
# 它一个容器内同时跑 nginx(前端) + Python(API/面板),并在启动时自动初始化
# (写好 postgres/redis/milvus 连接 + 建表),无需单独的 init / worker 容器。
#
# 另外几个是【基础设施】容器(不同软件,必须各自独立):
#   postgres:15(业务库) / redis:latest(缓存) /
#   minio(Milvus 后端存储;察元自身对象存储默认走本地,见下) / milvusdb/milvus:v2.6.15(向量库) + etcd
# 察元用【容器服务名】连它们;数据全部映射到宿主机 docker/ 下。
#
# 启动:
#   cd docker
#   docker compose up -d                       # 默认就是这套网络部署
#   浏览器 http://<host>:8080/   后端 API http://<host>:62581/  面板 :8502
#   (端口遵循原有约定:8080 网页 / 62581 后端 API(WPS 等固定连它,别改) / 8502 面板)
#
# ⚠ 报「8080 already allocated」= 有别的容器(多半是单机版或旧残留)占着端口。
#    先 `docker compose -f docker-compose.single.yaml down` + 清掉同名容器,别和单机版同起
#    (两者 container_name 都叫 chayuan-server)。真要换网页口在 .env 设 CHAYUAN_WEB_PORT(62581 别改)。
#
# 换件:业务库换 MySQL → 放开下方 mysql 服务 + chayuan 环境里的 CHAYUAN_DB_URI(注释 postgres);
#       向量库换别的 → Milvus 默认,起容器后进 /admin「向量库」切。
# ====================================================================
name: chayuan-network

services:
  # ───────────────── 业务库:PostgreSQL ─────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 业务库(可选):MySQL ─────────────────
  # 换 MySQL:放开本服务 + chayuan-server 环境里的 CHAYUAN_DB_URI,并注释 postgres。需 mysql:8 镜像。
  # mysql:
  #   image: mysql:8
  #   container_name: mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_DATABASE: ${MYSQL_DB:-chayuan}
  #     MYSQL_USER: ${MYSQL_USER:-chayuan}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chayuan}
  #   command: ["--default-authentication-plugin=mysql_native_password"]
  #   volumes:
  #     - ./volumes/mysql:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # ───────────────── 缓存:Redis ─────────────────
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── 对象存储:MinIO(兼 Milvus 后端存储) ─────────────────
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ───────────────── 向量库:Milvus(默认) + etcd 依赖 ─────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ───────────────── 察元:就这一个容器(前端 + 后端 + 面板) ─────────────────
  # 同一个镜像 chayuan:<版本>(默认 chayuan:latest)。启动时先自动初始化(写 postgres/redis/milvus 连接
  # + 建表,幂等),再用镜像自带 entrypoint 跑 nginx(前端) + Python(API/面板)。
  chayuan-server:
    image: ${CHAYUAN_IMAGE:-chayuan}:${CHAYUAN_TAG:-latest}
    container_name: chayuan-server
    restart: unless-stopped
    # uvicorn 多 worker(prod=4)在 `up -d`(无 stdin)下会 os.fdopen(stdin) 报
    # 「Bad file descriptor」。保持 stdin 打开,给子进程一个有效 fd 0,即可修复。
    stdin_open: true
    # 一个容器内:先 init(写好连接+建表,幂等可重复),再 exec 原 entrypoint 起 nginx+API。
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
    command:
      - >-
        cd /chayuan/app/chayuan-server/libs/chayuan-server &&
        (python -m chayuan init -q --profile prod || echo '[init] 非致命,start 会再建表') &&
        exec /usr/local/bin/entrypoint.sh start -a
    environment:
      CHAYUAN_ROOT: /chayuan/data
      CHAYUAN_PROFILE: ""                 # 空=网络形态(别用 single-machine,否则覆盖回 sqlite)
      CHAYUAN_AUTO_INSTALL_DEPS: "false"
      # 业务库 = PostgreSQL(容器名 postgres)
      CHAYUAN_PG_HOST: postgres
      CHAYUAN_PG_PORT: "5432"
      CHAYUAN_PG_USER: ${POSTGRES_USER:-chayuan}
      CHAYUAN_PG_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      CHAYUAN_PG_DB: ${POSTGRES_DB:-chayuan}
      # 换 MySQL:注释上面 PG_*,放开下面(并放开 mysql 服务 + 注释 postgres 服务)
      # CHAYUAN_DB_URI: "mysql+pymysql://${MYSQL_USER:-chayuan}:${MYSQL_PASSWORD:-chayuan}@mysql:3306/${MYSQL_DB:-chayuan}"
      # 缓存 = Redis(容器名 redis)
      CHAYUAN_REDIS_URL: redis://redis:6379/0
      # 向量库 = Milvus(容器名 milvus → http://milvus:19530)
      CHAYUAN_MILVUS_HOST: milvus
      CHAYUAN_MILVUS_PORT: "19530"
      # 对象存储默认走【本地】(文件落 ./data,已映射宿主机),开箱即用、浏览器可达。
      # ⚠ 不要在这里把 FILE_STORAGE_BACKEND 设成 minio:minio 容器没对外发布、用的是
      #   内部主机名 minio:9000,后端给浏览器的文件链接会指向它 → 浏览器 405 打不开。
      #   要用 MinIO 当对象存储,得先把 minio 端口对外发布 + 配一个【浏览器可达】的
      #   公网 endpoint(presigned URL 用),再开这几项;否则保持 local。
      # FILE_STORAGE_BACKEND: minio
      # MINIO_ENDPOINT: minio:9000
      # MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      # MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # MINIO_SECURE: "false"
      # 单容器:入库走同步(不依赖独立 worker)。要高并发后台入库再拆 worker。
      INGEST_ASYNC_ENABLED: "false"
      # JWT 留空则首次随机生成并持久化;想固定填 .env 的 JWT_SECRET
      CHAYUAN_JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./data:/chayuan/data
      - ./bundled_models:/chayuan/app/chayuan-server/vendor/bundled_models
      - ./config:/chayuan/config
      - ./logs:/chayuan/logs
    ports:
      - "${CHAYUAN_WEB_PORT:-8080}:80"      # 前端 + API 反代 ← 浏览器主入口
      - "62581:62581"                       # ★ 后端 API 直连:WPS / Tauri / 三方都连这个,固定不可改
      - "8502:8502"                         # 后台配置面板(NiceGUI)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

# ── 共享网络:两个 compose(docker-compose.yaml / docker-compose.single.yaml)统一用它 ──
# 默认网络都指到同名网络 chayuan-net,确保【跨文件也能用容器名互相访问】。
# 不存在时 compose 会【自动创建】,无需手动 docker network create。
# ⚠ 只有一种情况要先删:你之前【手动】建过 chayuan-net(报 incorrect label 时),
#   执行一次 `docker network rm chayuan-net` 让 compose 接管即可。
networks:
  default:
    name: chayuan-net
