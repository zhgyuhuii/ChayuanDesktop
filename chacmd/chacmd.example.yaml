# ChaCMD orchestrator 配置样例。
# 用法：复制为 chacmd.yaml 放在启动目录，`python -m chacmd.cli start` 自动读取；
#       或 `python -m chacmd.cli start -c 路径/chacmd.yaml`。
# 分层：字段默认值 < 本 yaml < 环境变量（CHACMD_* / CHAYUAN_BASE_URL 等）。
# 只写你要改的键即可，其余用默认。

# ── 察元母体对接（形态 B 桌面 sidecar 用 62581；开发态用 8000）──
chayuan_base_url: "http://127.0.0.1:8000"
chayuan_web_url: "http://127.0.0.1:5173"

# ── 状态库 ──
# 开发/单机：sqlite（零基建）；生产：postgres+asyncpg://user:pass@host:5432/chacmd
db_url: "sqlite+aiosqlite:///./chacmd.db"

# ── 监听 ──
api_host: "0.0.0.0"
api_port: 8100
gateway_host: "0.0.0.0"
gateway_port: 8767          # agent-bridge 反连口

# ── 运行档（开发用 fake/memory 零基建；生产按需切）──
event_bus: "memory"         # memory | nats
nats_url: "nats://127.0.0.1:4222"
sandbox: "fake"             # fake | docker
sandbox_image: "chatop-ai:latest"
agent_adapter: "fake"       # fake | openhands

# ── 护栏 ──
default_token_budget: 100000   # per-job token 硬预算，0=不限
