[package]
name = "chayuan-publisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chayuan_publisher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
# 锁死 brotli 8.0.3 依赖图:brotli-decompressor 5.0.2 / alloc-stdlib 0.2.3 把 alloc-no-stdlib
# 拉到 3.0.0,与 brotli 自身的 2.0.4 分裂 → StandardAlloc/BrotliAlloc 的 Allocator trait 对不上
# (E0277 x36)。把引入 <4 范围的这两个 crate 钉回「只吃 2.x」的版本,图里就没任何路径到 3.0.0,
# alloc-no-stdlib 统一为 2.0.4。三者均在 brotli 8.0.3 约束内(brotli-decompressor ~5.0 /
# alloc-stdlib ~0.2)。直接依赖只为钉版本,代码不 use。
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
futures-util = "0.3"
