<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>察元 AI 启动中</title>
    <!--
      ▍独立 splashscreen 窗口入口。

      为什么是独立 HTML 而不是塞进 index.html:
        Tauri 启动主窗口时,webview 要 fetch vite chunk + 解析 ESM + import 整个 React
        bundle,首帧 paint 经常被这条链卡住几百毫秒到数秒,用户只看到 Tauri 窗口默认
        background color(此项目是 #0f172a 深蓝),也就是"蓝屏"。

      方案:
        - tauri.conf.json 配两个 windows:main(visible: false 初始隐藏)+
          splashscreen(visible: true,加载这个文件)
        - 本文件是纯静态 HTML+inline CSS,无任何 JS bundle / vite chunk 依赖,
          webview 几乎 instant paint
        - main.tsx 在 React 首屏 paint 之后 invoke('close_splashscreen') →
          Rust 端 close splash window + show main window

      因此本文件**严禁**:
        - <script src="..."> 引用外部 JS
        - <link rel="..."> 引用外部 CSS / font
        - 任何 import / fetch / require
      全部样式与动画必须 inline 在本文件,确保零外部依赖、零等待。
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      /* 整窗背景渐变 + 圆角(transparent 窗口可见性) */
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 14px;
        background:
          radial-gradient(ellipse at center,
            rgba(99,102,241,0.28), rgba(14,165,233,0.12) 45%, transparent 75%),
          linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      }
      * { box-sizing: border-box; }

      /* 多彩 conic 圆环 */
      .ring {
        position: absolute;
        width: 156px; height: 156px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #6366f1, #06b6d4, #ec4899, #f59e0b, #6366f1);
        animation: spin 2.4s linear infinite;
        filter: blur(0.5px);
        -webkit-mask: radial-gradient(circle, transparent 66px, black 68px, black 76px, transparent 78px);
                mask: radial-gradient(circle, transparent 66px, black 68px, black 76px, transparent 78px);
      }

      /* 三色卫星 */
      .orbits { position: absolute; animation: spin-rev 3.8s linear infinite; }
      .orbit { position: absolute; display: block; border-radius: 50%; }
      .o1 {
        width: 11px; height: 11px; background: #6366f1;
        box-shadow: 0 0 14px #6366f1, 0 0 28px rgba(99,102,241,0.55);
        animation: orbit-1 2.2s linear infinite;
      }
      .o2 {
        width: 9px; height: 9px; background: #06b6d4;
        box-shadow: 0 0 12px #06b6d4, 0 0 24px rgba(6,182,212,0.55);
        animation: orbit-2 2.8s linear infinite;
      }
      .o3 {
        width: 8px; height: 8px; background: #ec4899;
        box-shadow: 0 0 12px #ec4899, 0 0 24px rgba(236,72,153,0.55);
        animation: orbit-3 3.4s linear infinite;
      }

      /* 中心呼吸光球 */
      .core {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        width: 64px; height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #a5b4fc, #6366f1 60%, #4338ca);
        box-shadow: 0 0 28px rgba(99,102,241,0.7), inset 0 0 14px rgba(255,255,255,0.4);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .shimmer {
        position: absolute; top: 0; bottom: 0; width: 60%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: shimmer 1.8s ease-in-out infinite;
        filter: blur(2px);
      }

      /* 标语 */
      .tag {
        position: absolute;
        bottom: 12%; left: 0; right: 0;
        text-align: center;
        font-size: 14px; font-weight: 500; line-height: 1.6;
        color: rgba(226,232,240,0.92);
        letter-spacing: 0.08em;
      }
      .tag-sub {
        margin-top: 6px;
        font-size: 11px;
        color: rgba(148,163,184,0.85);
        letter-spacing: 0.04em;
      }

      @keyframes spin     { to { transform: rotate(360deg); } }
      @keyframes spin-rev { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%,100% { transform: scale(1);    opacity: .85; }
        50%     { transform: scale(1.18); opacity: 1; }
      }
      @keyframes orbit-1 {
        from { transform: rotate(0deg)   translateX(34px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(34px) rotate(-360deg); }
      }
      @keyframes orbit-2 {
        from { transform: rotate(120deg) translateX(46px) rotate(-120deg); }
        to   { transform: rotate(480deg) translateX(46px) rotate(-480deg); }
      }
      @keyframes orbit-3 {
        from { transform: rotate(240deg) translateX(40px) rotate(-240deg); }
        to   { transform: rotate(600deg) translateX(40px) rotate(-600deg); }
      }
      @keyframes shimmer {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX( 120%); }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-busy="true" aria-live="polite">
      <div class="ring"></div>
      <div class="orbits">
        <span class="orbit o1"></span>
        <span class="orbit o2"></span>
        <span class="orbit o3"></span>
      </div>
      <div class="core">
        <span class="shimmer"></span>
      </div>
      <div class="tag">
        察元 AI
        <div class="tag-sub">正在启动…</div>
      </div>
    </div>
  </body>
</html>
