<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>察元 AI</title>
    <!-- 内联 SVG favicon,避免 dev 下 GET /favicon.ico 404 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='50%25' y='58%25' font-family='PingFang SC,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3E察%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      启动 splash —— 在 React bundle 加载/解析期间(双击图标到 createRoot 之间
      约 200ms-2s)直接由 HTML 渲染,占据整个 #app 容器。
      React 在 main.tsx 里调 createRoot(#app).render(...) 时,createRoot 会清空
      容器 children 再挂 React tree,本 splash 自然消失,不需要手动 remove。

      纯内联 CSS,无外部依赖;键名 cy-splash- 前缀避免与业务样式冲突。
    -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; }
      #app { height: 100vh; width: 100vw; }
      .cy-splash {
        position: relative;
        display: flex;
        height: 100%;
        width: 100%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at center,
            rgba(99,102,241,0.18), rgba(14,165,233,0.10) 45%, transparent 70%),
          #0f172a;
      }
      .cy-splash * { box-sizing: border-box; }

      .cy-splash-ring {
        position: absolute;
        width: 132px; height: 132px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #6366f1, #06b6d4, #ec4899, #f59e0b, #6366f1);
        animation: cy-splash-spin 2.4s linear infinite;
        filter: blur(0.5px);
        -webkit-mask: radial-gradient(circle, transparent 56px, black 58px, black 64px, transparent 66px);
                mask: radial-gradient(circle, transparent 56px, black 58px, black 64px, transparent 66px);
      }

      .cy-splash-orbits {
        position: absolute;
        animation: cy-splash-spin-rev 3.8s linear infinite;
      }
      .cy-splash-orbit {
        position: absolute;
        display: block;
        border-radius: 50%;
      }
      .cy-splash-o1 {
        width: 10px; height: 10px;
        background: #6366f1;
        box-shadow: 0 0 12px #6366f1, 0 0 22px rgba(99,102,241,0.55);
        animation: cy-splash-orbit-1 2.2s linear infinite;
      }
      .cy-splash-o2 {
        width: 8px; height: 8px;
        background: #06b6d4;
        box-shadow: 0 0 10px #06b6d4, 0 0 20px rgba(6,182,212,0.55);
        animation: cy-splash-orbit-2 2.8s linear infinite;
      }
      .cy-splash-o3 {
        width: 7px; height: 7px;
        background: #ec4899;
        box-shadow: 0 0 10px #ec4899, 0 0 20px rgba(236,72,153,0.55);
        animation: cy-splash-orbit-3 3.4s linear infinite;
      }

      .cy-splash-core {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        width: 56px; height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #a5b4fc, #6366f1 60%, #4338ca);
        box-shadow: 0 0 24px rgba(99,102,241,0.55), inset 0 0 12px rgba(255,255,255,0.35);
        animation: cy-splash-pulse 1.6s ease-in-out infinite;
      }
      .cy-splash-shimmer {
        position: absolute;
        top: 0; bottom: 0;
        width: 60%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
        animation: cy-splash-shimmer 1.8s ease-in-out infinite;
        filter: blur(2px);
      }

      .cy-splash-tag {
        position: absolute;
        bottom: 8vh;
        left: 0; right: 0;
        text-align: center;
        font: 500 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: rgba(226,232,240,0.85);
        letter-spacing: 0.06em;
      }
      .cy-splash-tag-sub {
        margin-top: 6px;
        font-size: 11px;
        color: rgba(148,163,184,0.85);
      }

      @keyframes cy-splash-spin     { to { transform: rotate(360deg); } }
      @keyframes cy-splash-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes cy-splash-pulse {
        0%,100% { transform: scale(1);    opacity: .85; }
        50%     { transform: scale(1.18); opacity: 1; }
      }
      @keyframes cy-splash-orbit-1 {
        from { transform: rotate(0deg)   translateX(28px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(28px) rotate(-360deg); }
      }
      @keyframes cy-splash-orbit-2 {
        from { transform: rotate(120deg) translateX(40px) rotate(-120deg); }
        to   { transform: rotate(480deg) translateX(40px) rotate(-480deg); }
      }
      @keyframes cy-splash-orbit-3 {
        from { transform: rotate(240deg) translateX(34px) rotate(-240deg); }
        to   { transform: rotate(600deg) translateX(34px) rotate(-600deg); }
      }
      @keyframes cy-splash-shimmer {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX( 120%); }
      }
    </style>
    <div id="app">
      <div class="cy-splash" aria-busy="true" aria-live="polite">
        <div class="cy-splash-ring"></div>
        <div class="cy-splash-orbits">
          <span class="cy-splash-orbit cy-splash-o1"></span>
          <span class="cy-splash-orbit cy-splash-o2"></span>
          <span class="cy-splash-orbit cy-splash-o3"></span>
        </div>
        <div class="cy-splash-core">
          <span class="cy-splash-shimmer"></span>
        </div>
        <div class="cy-splash-tag">
          察元 AI
          <div class="cy-splash-tag-sub">正在加载…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
