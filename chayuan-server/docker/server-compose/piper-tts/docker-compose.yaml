# Piper TTS — LinuxServer Wyoming 协议服务（常用于 Home Assistant Assist）
# 启动: docker compose -f docker-compose.yaml up -d
# 文档: https://docs.linuxserver.io/images/docker-piper/
version: "3.8"

services:
  piper:
    image: lscr.io/linuxserver/piper:latest
    container_name: piper-tts
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PIPER_VOICE=en_US-lessac-medium
    volumes:
      - piper-config:/config
    ports:
      - "10200:10200"

volumes:
  piper-config:
