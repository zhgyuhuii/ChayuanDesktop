# vLLM — OpenAI 兼容高吞吐 LLM 推理（需 NVIDIA GPU）
# 请将下方 command 中的模型名改为你要服务的 Hugging Face 或本地路径。
# 启动: docker compose -f docker-compose.yaml up -d
# 文档: https://docs.vllm.ai/en/latest/deployment/docker.html
version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-openai
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "18000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model
      - meta-llama/Llama-3.2-3B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

volumes:
  hf-cache:
