# ComfyUI — Stable Diffusion 等工作流界面（需 NVIDIA GPU）
# 启动: docker compose -f docker-compose.yaml up -d
# 模型可挂载到 ./models 或自定义路径
version: "3.8"

services:
  comfyui:
    image: ghcr.io/comfyanonymous/comfyui:latest
    container_name: comfyui
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8188:8188"
    volumes:
      # 官方镜像常见模型路径为 /comfyui/models（以实际镜像为准，可用 docker inspect 查看）
      - comfyui-models:/comfyui/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

volumes:
  comfyui-models:
