# Infinity — 文本嵌入 / 重排序 HTTP 服务
# 启动: docker compose -f docker-compose.yaml up -d
# 文档: https://github.com/michaelf34/infinity
version: "3.8"

services:
  infinity:
    image: michaelf34/infinity:latest
    container_name: infinity
    restart: unless-stopped
    ports:
      - "7997:7997"
