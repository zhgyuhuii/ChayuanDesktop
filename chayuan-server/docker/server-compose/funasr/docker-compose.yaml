# FunASR — 离线文件转写运行时（阿里云官方镜像）
# 镜像内为 SDK 环境；容器启动后需在容器内按官方文档执行 run_server.sh，例如:
#   docker exec -it funasr-offline bash
#   cd FunASR/runtime && nohup bash run_server.sh --download-model-dir /workspace/models ... &
# 说明: https://github.com/modelscope/FunASR/blob/main/runtime/quick_start_zh.md
version: "3.8"

services:
  funasr-offline:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.7
    container_name: funasr-offline
    restart: unless-stopped
    privileged: true
    ports:
      - "10095:10095"
    volumes:
      - funasr-models:/workspace/models
    tty: true
    stdin_open: true

volumes:
  funasr-models:
