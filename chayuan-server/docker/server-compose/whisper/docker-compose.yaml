# Whisper 类语音转写 — Speaches（OpenAI 兼容 API，后端 faster-whisper）
# CPU 默认: docker compose -f docker-compose.yaml up -d
# GPU:      docker compose -f docker-compose.yaml --profile gpu up -d
# 文档: https://github.com/speaches-ai/speaches
version: "3.8"

services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: whisper-speaches
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf-hub-cache:/root/.cache/huggingface

  whisper-gpu:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    container_name: whisper-speaches-gpu
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8001:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - hf-hub-cache:/root/.cache/huggingface
    profiles:
      - gpu

volumes:
  hf-hub-cache:
