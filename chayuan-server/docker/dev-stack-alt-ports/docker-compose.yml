# ===============================================================
# 察元开发栈 — "大端口"版本，与 ../dev-stack/docker-compose.yml 平行
# ===============================================================
# 与 dev-stack 唯一区别：所有对外端口都偏移到 30000+，避免与机器上既有的
# Postgres/Redis/MinIO/Milvus 默认端口冲突；适合：
#   - 本机已有 brew/apt 装好的 PostgreSQL 5432、Redis 6379；
#   - 多个 chayuan 实例并存（只需 .env 里改 prefix）；
#   - 安装包默认端口（与 chayuan/server/runtime/vendor_loader.py 中的
#     KNOWN_SERVICES 一致）。
#
# 用法：
#   cp .env.example .env
#   docker compose -f docker/dev-stack-alt-ports/docker-compose.yml up -d
#   chayuan service info        # 查看最终端口/凭据
#
# 端口对照（上游默认 → 本 compose）：
#   postgres   5432  → 35432
#   redis      6379  → 36379
#   minio API  9000  → 39000
#   minio UI   9001  → 39001
#   milvus    19530  → 39530
#   milvus mt  9091  → 39091
#   ollama    11434  → 31434
# ===============================================================
name: chayuan-dev-altports

services:
  postgres:
    image: postgres:16-alpine
    container_name: chayuan-altports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?设置 .env 中的 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
    ports:
      - "127.0.0.1:${CHAYUAN_PG_PORT:-35432}:5432"
    volumes:
      - chayuan_altports_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: chayuan-altports-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory 1gb --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory 1gb
        fi
    ports:
      - "127.0.0.1:${CHAYUAN_REDIS_PORT:-36379}:6379"
    volumes:
      - chayuan_altports_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: chayuan-altports-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chayuan_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?设置 .env 中的 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${CHAYUAN_MINIO_PORT:-39000}:9000"
      - "127.0.0.1:${CHAYUAN_MINIO_CONSOLE_PORT:-39001}:9001"
    volumes:
      - chayuan_altports_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: chayuan-altports-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    volumes:
      - chayuan_altports_etcd:/etcd

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: chayuan-altports-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-chayuan_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
      milvus-etcd:
        condition: service_started
    ports:
      - "127.0.0.1:${CHAYUAN_MILVUS_PORT:-39530}:19530"
      - "127.0.0.1:${CHAYUAN_MILVUS_METRICS_PORT:-39091}:9091"
    volumes:
      - chayuan_altports_milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  ollama:
    image: ollama/ollama:0.21.2
    container_name: chayuan-altports-ollama
    restart: unless-stopped
    profiles: ["ollama", "full"]
    ports:
      - "127.0.0.1:${CHAYUAN_OLLAMA_PORT:-31434}:11434"
    volumes:
      - chayuan_altports_ollama:/root/.ollama

volumes:
  chayuan_altports_pg:
  chayuan_altports_redis:
  chayuan_altports_minio:
  chayuan_altports_etcd:
  chayuan_altports_milvus:
  chayuan_altports_ollama:
