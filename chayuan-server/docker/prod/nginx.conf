# ============================================================================
# Nginx 反代模板（chayuan 生产）
#
# 关键点：
#   - HTTP/2 + TLS + gzip + keepalive
#   - upstream least_conn + active health check（通过 /healthz；OSS 版只有 passive）
#   - 聊天流式接口：proxy_buffering off + proxy_read_timeout 600s
#   - 边缘限流作为第二道防线，即使 chayuan 自身限流挂了也有保底
#
# 使用：
#   - 把 <DOMAIN> 换成你的域名
#   - 把 /etc/letsencrypt/... 证书路径换成你的
#   - reload: `nginx -s reload`
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75;
    keepalive_requests 1000;

    client_max_body_size 200m;  # 知识库文件上传
    client_body_buffer_size 256k;

    # 日志格式里带 request id，方便和 chayuan-api 日志对齐
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rid=$upstream_http_x_request_id rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain text/xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------------
    # 边缘限流：按 IP 令牌桶 + 突发 20。与 chayuan 自身限流互为冗余。
    # ------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=chayuan_api:20m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=chayuan_conn:20m;

    # ------------------------------------------------------------------------
    # 上游：chayuan API 副本。Docker compose 里服务名就是 DNS 名。
    # least_conn 适合流式/长连接请求混合的场景。
    # ------------------------------------------------------------------------
    upstream chayuan_api {
        least_conn;
        server chayuan-api:7861 max_fails=3 fail_timeout=10s;
        # 横向扩展时在这里加：
        # server chayuan-api-2:7861;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ------------------------------------------------------------------------
    # 80 → 443 跳转
    # ------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------------
    # 443 主站
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 10m;

        # nginx 主动把真实 IP + scheme 带给 chayuan，用于限流与 request id
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # 统一 upstream keepalive（见 upstream 块）
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # --------------------------------------------------------------------
        # 健康检查：nginx 的 OSS 版本只支持 passive，这里暴露 /healthz 让
        # 监控平台（Uptime Kuma / Blackbox exporter 等）做 active 探活。
        # --------------------------------------------------------------------
        location = /healthz {
            proxy_pass http://chayuan_api/healthz;
            access_log off;
        }
        location = /readyz {
            proxy_pass http://chayuan_api/readyz;
            access_log off;
        }

        # --------------------------------------------------------------------
        # 对话 / 流式：关闭 proxy_buffering，放大超时，避免 SSE 截断
        # --------------------------------------------------------------------
        location ~* ^/(chat|v1/chat|openai|knowledge_base_chat) {
            limit_req zone=chayuan_api burst=20 nodelay;
            limit_conn chayuan_conn 50;

            proxy_pass http://chayuan_api;
            proxy_buffering off;
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 5s;
        }

        # --------------------------------------------------------------------
        # 其它 API：普通反代
        # --------------------------------------------------------------------
        location / {
            limit_req zone=chayuan_api burst=40 nodelay;
            limit_conn chayuan_conn 100;

            proxy_pass http://chayuan_api;
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_connect_timeout 5s;
        }

        # 静态资源缓存
        location ~* \.(png|jpg|jpeg|gif|svg|ico|css|js)$ {
            proxy_pass http://chayuan_api;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
