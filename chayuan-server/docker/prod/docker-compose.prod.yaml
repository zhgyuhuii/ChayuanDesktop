# ============================================================================
# chayuan 生产 docker-compose 模板
#
# 包含：
#   - chayuan-api   ×1（内部多 worker；横向副本见 README）
#   - postgres      ×1
#   - redis         ×1
#   - milvus        standalone（生产请换 cluster，见 milvus 官方示例）
#   - vllm          ×1（GPU；可删）
#   - tei           ×1（GPU；embedding 服务；可删）
#   - nginx         ×1（TLS + 限流 + active health check）
#
# 启动：
#   cp env.prod.example .env  && 按需修改
#   docker compose -f docker-compose.prod.yaml up -d
#
# 实际生产强烈建议：
#   - Postgres / Redis / Milvus 用云托管版本；上面只做最小可跑示例
#   - vLLM 放在独立 GPU 机，chayuan-api 通过内网连接
# ============================================================================

name: chayuan-prod

services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PG_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chayuan]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${REDIS_DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [chayuan]

  # --- Milvus standalone（仅示例，生产用 cluster） ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ${MILVUS_DATA_DIR}/etcd:/etcd
    networks: [chayuan]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - ${MILVUS_DATA_DIR}/minio:/minio_data
    networks: [chayuan]

  milvus:
    # ⚠️ 生产从 v2.4 升 v2.6 必须经 v2.5.16 中转（官方约束）
    image: milvusdb/milvus:v2.6.15
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [chayuan]

  # --- LLM 推理（vLLM）---
  vllm:
    image: vllm/vllm-openai:latest
    restart: always
    command:
      - "--model=${VLLM_MODEL}"
      - "--served-model-name=${VLLM_SERVED_NAME}"
      - "--max-model-len=8192"
      - "--max-num-seqs=128"
      - "--gpu-memory-utilization=0.9"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${CHAYUAN_DATA_DIR}/hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [chayuan]

  # --- Embedding 服务（TEI）---
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    restart: always
    command:
      - "--model-id=${TEI_MODEL}"
      - "--max-batch-tokens=16384"
    volumes:
      - ${CHAYUAN_DATA_DIR}/tei-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [chayuan]

  # --- 察元 API 服务 ---
  chayuan-api:
    image: ${CHAYUAN_IMAGE}
    restart: always
    command: ["chayuan", "start", "--api"]
    environment:
      CHAYUAN_ROOT: /root/chayuan_data
    volumes:
      # 生产配置从仓库 docker/prod/chayuan/ 映射进容器
      - ./chayuan:/root/chayuan_data:ro
      - ${CHAYUAN_DATA_DIR}/logs:/root/chayuan_data/data/logs
      - ${CHAYUAN_DATA_DIR}/kb:/root/chayuan_data/data/knowledge_base
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7861/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks: [chayuan]

  # 横向扩展示例：把下面取消注释即可得到第 2 个副本
  # chayuan-api-2:
  #   <<: *chayuan-api  # YAML anchor 不原生支持 compose，可用 extends 或复制块
  #   ...

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CHAYUAN_DATA_DIR}/certs:/etc/nginx/certs:ro
      - ${CHAYUAN_DATA_DIR}/nginx-logs:/var/log/nginx
    depends_on: [chayuan-api]
    networks: [chayuan]

networks:
  chayuan:
    driver: bridge
