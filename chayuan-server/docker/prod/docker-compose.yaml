# ============================================================================
# chayuan-server 生产级 docker-compose 一键部署
#
# 起来以后对外暴露：
#   - 80    → nginx → chayuan-api（默认禁用；启用改 ports: 且写好 nginx.conf）
#   - 62581  → chayuan-api（/docs、/metrics、/healthz）
#   - 8502  → chayuan-panel（NiceGUI 配置面板）
#
# 用法：
#   cd docker/prod
#   cp env.example .env     # 按需改账号 / 密码
#   docker compose up -d --build
#
# 首次 up 时 chayuan-api / worker / panel 容器会：
#   1. /data 为空 → 跑 `chayuan init --profile prod -q` 生成 postgres/milvus/redis
#      的 yaml；
#   2. 等待 postgres / redis / milvus TCP 就绪；
#   3. 启动对应进程。
#
# 生产请务必在 .env 里设强随机 JWT_SECRET / DB 密码，并改 AUTH_ALLOW_REGISTRATION
# 的策略；默认镜像里 AUTH_REQUIRED=true、注册关闭、有随机种子 admin（首次启动
# 日志可见初始密码）。
# ============================================================================

name: chayuan-prod

# 公用 env：所有 chayuan-* 服务都把这些 CHAYUAN_xxx 注入进去，
# 配合入口脚本和 init_prod_profile.py 生成 pg/milvus/redis 连接串。
x-chayuan-env: &chayuan-env
  CHAYUAN_ROOT: /data
  CHAYUAN_INIT_PROFILE: prod
  # 数据库
  CHAYUAN_PG_HOST: postgres
  CHAYUAN_PG_PORT: "5432"
  CHAYUAN_PG_USER: ${POSTGRES_USER:-chayuan}
  CHAYUAN_PG_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
  CHAYUAN_PG_DB: ${POSTGRES_DB:-chayuan}
  # redis
  CHAYUAN_REDIS_URL: redis://redis:6379/0
  # milvus
  CHAYUAN_MILVUS_HOST: milvus
  CHAYUAN_MILVUS_PORT: "19530"
  # JWT
  CHAYUAN_JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置强随机 JWT_SECRET}

# 所有 chayuan-* 共用的资源/依赖模板；具体服务通过 extends / 直接引用
x-chayuan-base: &chayuan-base
  image: chayuan-server:${CHAYUAN_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: docker/prod/Dockerfile
  restart: always
  volumes:
    - chayuan-data:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
    milvus:   { condition: service_started }
  networks: [chayuan]

services:

  # -------------------- 基础设施 --------------------

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chayuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chayuan}
      POSTGRES_DB: ${POSTGRES_DB:-chayuan}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chayuan} -d ${POSTGRES_DB:-chayuan}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chayuan]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [chayuan]

  # --- Milvus standalone（生产建议换 cluster；这里给最小可跑配置） ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - milvus-etcd:/etcd
    networks: [chayuan]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    volumes:
      - milvus-minio:/minio_data
    networks: [chayuan]

  milvus:
    # ⚠️ 生产从 v2.4 升 v2.6 必须经 v2.5.16 中转（官方约束），且需 backup → 升 2.5 →
    # backup → 升 2.6 两步走；不能直跳。详见 milvus 官方 upgrade docs。
    image: milvusdb/milvus:v2.6.15
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on: [etcd, minio]
    healthcheck:
      # milvus 对外暴露 9091/healthz
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    volumes:
      - milvus-data:/var/lib/milvus
    networks: [chayuan]

  # -------------------- chayuan 应用 --------------------

  chayuan-api:
    <<: *chayuan-base
    command: ["api"]
    environment:
      <<: *chayuan-env
    ports:
      - "${API_PORT:-62581}:62581"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:62581/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  chayuan-worker:
    <<: *chayuan-base
    command: ["worker"]
    environment:
      <<: *chayuan-env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      milvus:   { condition: service_started }
      chayuan-api: { condition: service_healthy }

  chayuan-panel:
    <<: *chayuan-base
    command: ["panel"]
    environment:
      <<: *chayuan-env
    ports:
      - "${PANEL_PORT:-8502}:8502"
    depends_on:
      chayuan-api: { condition: service_healthy }

  # -------------------- 可选：nginx --------------------
  # 默认注释，需要 TLS / 反代时开启。
  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on: [chayuan-api]
  #   networks: [chayuan]

volumes:
  chayuan-data: {}
  pg-data: {}
  redis-data: {}
  milvus-etcd: {}
  milvus-minio: {}
  milvus-data: {}

networks:
  chayuan:
    driver: bridge
